<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عيادتي</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f3f7f8;--cd:#fff;--tx:#12303a;--mu:#6b8590;--pr:#0f8b8d;--p2:#e1f3f3;--bd:#dbe6e9;--ok:#2e9e5b;--er:#d9534f;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0e1c21;--cd:#16282f;--tx:#e6f1f3;--mu:#8fa8b1;--pr:#2bb3b5;--p2:#17383b;--bd:#264047;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px Tahoma,Arial,sans-serif;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
.w{max-width:560px;margin:auto;padding:12px}
button,input,select{font:inherit;color:inherit}
button,.b{background:var(--p2);color:var(--pr);border:0;border-radius:10px;padding:11px 12px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.p{background:var(--pr);color:#fff}.on{background:var(--pr);color:#fff}
input,select{width:100%;padding:12px;margin:4px 0;border:1px solid var(--bd);border-radius:10px;background:var(--cd)}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}.c h3{margin:0 0 8px;font-size:16px}
.nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;position:sticky;top:0;background:var(--bg)}.nav button{white-space:nowrap}
.gr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st{background:var(--p2);border-radius:12px;padding:10px;text-align:center}.st b{display:block;font-size:20px;color:var(--pr)}.st span{color:var(--mu);font-size:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.row small{display:block;color:var(--mu)}.mu{color:var(--mu)}.tag{background:var(--p2);color:var(--pr);padding:3px 9px;border-radius:20px;font-size:12px;white-space:nowrap}
.teeth{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;direction:ltr;margin:6px 0 12px}
.tt{aspect-ratio:1;padding:0;font-size:13px;background:var(--cd);color:var(--tx);border:1px solid var(--bd)}
.tt.h{background:var(--p2);border-color:var(--pr)}.tt.x{background:var(--er);color:#fff}.tt.s{background:var(--pr);color:#fff}
.t{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:20px;z-index:9}
</style>
</head>
<body>
<div class="w" id="app">جارٍ التحميل…</div>
<script>
const U='https://qmpkufewmjlggacjivfp.supabase.co',K='sb_publishable_FImCadKH3NWYFBYdUQW6Xg_gHdSCmLY';
const db=supabase.createClient(U,K,{auth:{storageKey:'sb-patient'}}),$=i=>document.getElementById(i),A=$('app');
const SN={requested:'بانتظار الموافقة',booked:'مؤكد',waiting:'في الانتظار',in_treatment:'قيد العلاج',done:'انتهى',cancelled:'ملغي',no_show:'لم يحضر'};
const CD={filling:'حشوة',root_canal:'علاج عصب',extraction:'خلع',cleaning:'تنظيف',crown:'تلبيسة',bridge:'جسر',implant:'زرعة',braces:'تقويم',missing:'سن مفقود',decay:'تسوس',fracture:'كسر',other:'أخرى'};
const UP=[18,17,16,15,14,13,12,11,21,22,23,24,25,26,27,28],LO=[48,47,46,45,44,43,42,41,31,32,33,34,35,36,37,38];
let P,CL={},sv=[],dc=[],aps=[],th=[],dt=[],py=[],rx=[],nt=[],bal={},tab='home',to=null,mode='in',tp=[],CS=[],MY=[],view='dir',cid=null,PR=null,bk=null,ch=null;
const toast=m=>{const e=document.createElement('div');e.className='t';e.textContent=m;document.body.append(e);setTimeout(()=>e.remove(),2500)};
const em=ph=>ph.replace(/\D/g,'')+'@pt.clinic',money=n=>Number(n||0).toLocaleString('en');
const dd=s=>new Date(s).toLocaleDateString('ar'),dtm=s=>new Date(s).toLocaleString('ar',{dateStyle:'medium',timeStyle:'short'});

const sn=x=>{const s=sv.find(v=>v.id==x.service_id);return s?s.name:(sn(x))};
const idEmail=v=>{v=String(v).trim();return v.includes('@')?v.toLowerCase():v.replace(/\D/g,'')+'@pt.clinic'};
async function boot(){const{data:{session}}=await db.auth.getSession();if(!session)return login();await loadAll(true);
 if(!ch)ch=db.channel('p').on('postgres_changes',{event:'*',schema:'public',table:'appointments'},load).on('postgres_changes',{event:'*',schema:'public',table:'notifications'},load).subscribe()}
function login(){
 const reg=mode=='reg';
 A.innerHTML=`<div class="c" style="margin-top:6vh"><h3>🦷 ${reg?'حساب جديد':'دخول المريض'}</h3>
 ${reg?`<input id="nm" placeholder="الاسم الكامل"><input id="ph" type="tel" inputmode="tel" placeholder="رقم الهاتف (تتصل بك العيادة عليه)" dir="ltr"><input id="mail" type="email" placeholder="البريد الإلكتروني (اختياري)" dir="ltr">`:`<input id="id" placeholder="رقم الهاتف أو البريد الإلكتروني" dir="ltr" autocapitalize="none">`}
 <input id="pin" type="password" placeholder="${reg?'كلمة مرور (6 أحرف أو أرقام على الأقل)':'كلمة المرور'}" dir="ltr">
 <button class="p" style="width:100%;margin-top:6px" onclick="${reg?'register()':'signin()'}">${reg?'إنشاء الحساب':'دخول'}</button>
 <p style="text-align:center"><a href="#" onclick="mode='${reg?'in':'reg'}';login();return false" style="color:var(--pr)">${reg?'لدي حساب':'مريض جديد؟ أنشئ حساباً'}</a></p>${reg?'<p class="mu" style="text-align:center">إن سجّلت بالبريد فادخل به لاحقاً، وإلا فبرقم الهاتف.</p>':''}</div>`}
async function signin(){const i=$('id').value,pw=$('pin').value;if(!i||pw.length<6)return toast('أدخل الهاتف/البريد وكلمة المرور');
 const{error}=await db.auth.signInWithPassword({email:idEmail(i),password:pw});if(error)return toast('بيانات الدخول غير صحيحة');boot()}
async function register(){
 const nm=$('nm').value.trim(),ph=$('ph').value.trim(),ml=$('mail').value.trim().toLowerCase(),pw=$('pin').value;
 if(!nm||ph.replace(/\D/g,'').length<7||pw.length<6)return toast('أكمل الاسم والهاتف وكلمة مرور 6 أحرف على الأقل');
 const r=await db.auth.signUp({email:ml||idEmail(ph),password:pw});
 if(r.error||!r.data.session)return toast(r.error?(/regist/i.test(r.error.message)?'الحساب موجود، سجّل الدخول':r.error.message):'تعذّر إنشاء الحساب');
 const p=await db.from('patient_accounts').upsert({user_id:r.data.user.id,full_name:nm,phone:ph});if(p.error)return toast(p.error.message);boot()}
async function out(){await db.auth.signOut();location.reload()}
async function loadAll(first){
 const{data:{session}}=await db.auth.getSession();if(!session)return login();
 const[pa,my,cl]=await Promise.all([db.from('patient_accounts').select('*').maybeSingle(),db.from('patients').select('*').eq('user_id',session.user.id),db.rpc('list_clinics')]);
 PR=pa.data;MY=my.data||[];CS=cl.data||[];
 if(!PR){A.innerHTML=`<div class="c" style="margin-top:6vh"><h3>أكمل بياناتك</h3><input id="nm" placeholder="الاسم الكامل"><input id="ph" type="tel" placeholder="رقم الهاتف" dir="ltr"><button class="p" style="width:100%" onclick="saveProf()">حفظ</button><p><a href="#" onclick="out();return false">خروج</a></p></div>`;return}
 if(first)view=MY.length?'app':'dir';
 if(!MY.find(p=>p.clinic_id==cid))cid=MY[0]?MY[0].clinic_id:null;
 if(view=='app'){if(cid)await loadClinic();else view='dir'}
 render()}
const load=()=>loadAll(false);
async function saveProf(){const n=$('nm').value.trim(),p=$('ph').value.trim();if(!n||!p)return toast('أكمل البيانات');const{data:{session}}=await db.auth.getSession();
 const r=await db.from('patient_accounts').upsert({user_id:session.user.id,full_name:n,phone:p});if(r.error)return toast(r.error.message);boot()}
async function loadClinic(){
 P=MY.find(p=>p.clinic_id==cid);const id=P.id;
 const R=await Promise.all([
  db.from('appointments').select('*').eq('patient_id',id).order('starts_at',{ascending:false}),
  db.from('treatment_history').select('*').eq('patient_id',id).order('performed_at',{ascending:false}),
  db.from('dental_treatments').select('*').eq('patient_id',id),
  db.from('payments').select('*').eq('patient_id',id).order('paid_at',{ascending:false}),
  db.from('prescriptions').select('*,prescription_items(*)').eq('patient_id',id).order('created_at',{ascending:false}),
  db.from('notifications').select('*').eq('patient_id',id).order('created_at',{ascending:false}).limit(5),
  db.from('patient_balances').select('*').eq('patient_id',id).maybeSingle(),
  db.rpc('clinic_services',{p_clinic:cid}),db.rpc('clinic_doctors',{p_clinic:cid}),
  db.from('treatment_plans').select('*').eq('patient_id',id).eq('status','planned').order('stage')]);
 [aps,th,dt,py,rx,nt]=R.slice(0,6).map(x=>x.data||[]);bal=R[6].data||{};sv=R[7].data||[];dc=R[8].data||[];tp=R[9].data||[];CL=CS.find(c=>c.id==cid)||{}}
function render(){if(view=='dir')A.innerHTML=dirUI();else if(view=='bk')A.innerHTML=bkUI();else renderC()}
function dirUI(){
 const nm=id=>(CS.find(c=>c.id==id)||{}).name||'عيادة';
 return`<div class="c"><h3>أهلاً ${PR.full_name} 👋</h3><p class="mu">اختر عيادة لحجز موعد.</p></div>
 ${MY.length?`<div class="c"><h3>عياداتي</h3>${MY.map(p=>`<div class="row"><span>${nm(p.clinic_id)}</span><button onclick="openC('${p.clinic_id}')">فتح</button></div>`).join('')}</div>`:''}
 <div class="c"><h3>العيادات المتاحة</h3>${CS.map(c=>`<div class="row"><span>${c.name}<small>${c.address||''}</small></span><button class="p" onclick="bookAt('${c.id}')">حجز</button></div>`).join('')||'<div class="mu">لا توجد عيادات متاحة حالياً</div>'}</div>
 <div class="c"><h3>لدي كود تفعيل من عيادة</h3><input id="cp" type="tel" placeholder="رقم الهاتف المسجل في العيادة" dir="ltr"><input id="cc" placeholder="كود التفعيل" dir="ltr"><button style="width:100%" onclick="claim()">ربط ملفي</button></div>
 <button onclick="out()" style="width:100%">تسجيل الخروج</button>`}
async function openC(c){cid=c;view='app';tab='home';await loadClinic();render()}
async function claim(){const r=await db.rpc('claim_patient',{p_phone:$('cp').value,p_code:$('cc').value.trim()});
 const m={ok:'',bad:'الكود غير صحيح',none:'الرقم غير مسجل أو لا يوجد كود',locked:'تم قفل الكود، اطلب كوداً جديداً'}[r.data]||(r.error&&r.error.message);
 if(m)return toast(m);toast('تم ربط ملفك');loadAll(false)}
async function bookAt(c){const[s,d]=await Promise.all([db.rpc('clinic_services',{p_clinic:c}),db.rpc('clinic_doctors',{p_clinic:c})]);
 bk={c,sv:(s.data||[]).filter(x=>x.active),dc:d.data||[]};view='bk';render()}
function bkUI(){
 const c=CS.find(x=>x.id==bk.c)||{},d=new Date(Date.now()+864e5-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);
 return`<div class="c"><h3>حجز في ${c.name||''}</h3><select id="bs"><option value="">فحص عام</option>${bk.sv.map(s=>`<option value="${s.id}">${s.name} - ${money(s.default_price)}</option>`).join('')}</select><select id="bd">${bk.dc.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}</select><input id="bt" type="datetime-local" value="${d}"><button class="p" style="width:100%" onclick="doBook()">إرسال الطلب</button><button style="width:100%;margin-top:8px" onclick="view='dir';render()">رجوع</button><p class="mu">ستؤكد العيادة طلبك وتتصل بك عند الحاجة.</p></div>`}
async function doBook(){const r=await db.rpc('request_appointment',{p_clinic:bk.c,p_service:$('bs').value||null,p_doctor:$('bd').value||null,p_time:new Date($('bt').value).toISOString()});
 if(r.error)return toast('خطأ: '+r.error.message);toast('أُرسل طلبك');cid=bk.c;view='app';tab='apt';await loadAll(false)}
function renderC(){
 const N=[['home','🏠 الرئيسية'],['book','➕ حجز'],['apt','📅 مواعيدي'],['teeth','🦷 أسناني'],['acc','💰 حسابي'],['plan','📋 خطتي'],['pr','💲 الأسعار'],['rx','💊 وصفاتي'],['cn','📞 العيادة']];
 const nav=N.map(([k,l])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';render()">${l}</button>`).join('');
 const now=Date.now()-36e5,nx=aps.filter(a=>['booked','requested','waiting','in_treatment'].includes(a.status)&&new Date(a.starts_at)>=now).sort((a,b)=>a.starts_at>b.starts_at?1:-1)[0];
 const ap=a=>`<div class="row"><span>${dtm(a.starts_at)}<small>${(sv.find(s=>s.id==a.service_id)||{}).name||''}</small></span><span style="display:flex;gap:6px;align-items:center"><span class="tag">${SN[a.status]}</span>${['requested','booked'].includes(a.status)?`<button onclick="cancelA('${a.id}')" style="padding:6px 10px">إلغاء</button>`:''}</span></div>`;
 let b='';
 if(tab=='home')b=`<div class="c"><h3>أهلاً ${P.full_name} 👋</h3>${nx?`<div class="st" style="text-align:start"><span>موعدك القادم</span><b>${dtm(nx.starts_at)}</b><span class="tag">${SN[nx.status]}</span></div>`:'<div class="mu">لا يوجد موعد قادم</div>'}</div>
 <div class="c"><h3>🔔 الإشعارات</h3>${nt.map(n=>`<div class="row"><span>${n.title||n.kind}<small>${dtm(n.created_at)}</small></span></div>`).join('')||'<div class="mu">لا إشعارات</div>'}</div>`;
 if(tab=='book'){const d=new Date(Date.now()+864e5-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);
 b=`<div class="c"><h3>طلب حجز موعد</h3><select id="bs"><option value="">فحص عام</option>${sv.filter(s=>s.active).map(s=>`<option value="${s.id}">${s.name} - ${money(s.default_price)}</option>`).join('')}</select><select id="bd">${dc.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}</select><input id="bt" type="datetime-local" value="${d}"><button class="p" style="width:100%" onclick="book()">إرسال الطلب</button><p class="mu">سيصلك إشعار عند موافقة العيادة.</p></div>`}
 if(tab=='apt')b=`<div class="c"><h3>مواعيدي</h3>${aps.map(ap).join('')||'<div class="mu">لا مواعيد</div>'}</div>`;
 if(tab=='teeth'){const cur={};dt.forEach(x=>cur[x.tooth_number]=x.condition);
 const tb=n=>{const c=cur[n];return`<button class="tt ${c?(c=='missing'||c=='extraction'?'x':'h'):''} ${to==n?'s':''}" onclick="to=${n};render()">${n}</button>`};
 b=`<div class="c"><h3>مخطط أسناني</h3><div class="mu">الفك العلوي</div><div class="teeth">${UP.map(tb).join('')}</div><div class="mu">الفك السفلي</div><div class="teeth">${LO.map(tb).join('')}</div><div class="mu">للعرض فقط ولا يمكن تعديله</div></div>
 ${to?`<div class="c"><h3>السن ${to}</h3>${th.filter(x=>x.tooth_number==to).map(x=>`<div class="row"><span>${sn(x)}<small>${dd(x.performed_at)}</small></span><b>${money(x.price)}</b></div>`).join('')||'<div class="mu">لا إجراءات</div>'}</div>`:''}`}
 if(tab=='acc')b=`<div class="c"><div class="gr"><div class="st"><b>${money(bal.total_cost)}</b><span>التكلفة</span></div><div class="st"><b>${money(bal.total_paid)}</b><span>المدفوع</span></div><div class="st"><b>${money(bal.remaining)}</b><span>المتبقي</span></div></div></div>
 <div class="c"><h3>الدفعات</h3>${py.map(x=>`<div class="row"><span>${dd(x.paid_at)}<small>${x.notes||''}</small></span><b>${money(x.amount)}</b></div>`).join('')||'<div class="mu">لا دفعات</div>'}</div>
 <div class="c"><h3>العلاجات</h3>${th.map(x=>`<div class="row"><span>${sn(x)}${x.tooth_number?' - سن '+x.tooth_number:''}<small>${dd(x.performed_at)}</small></span><b>${money(x.price)}</b></div>`).join('')||'<div class="mu">—</div>'}</div>`;
 if(tab=='plan')b=`<div class="c"><h3>خطة العلاج</h3>${tp.map(x=>`<div class="row"><span>${(sv.find(s=>s.id==x.service_id)||{}).name||''}${x.tooth_number?' - سن '+x.tooth_number:''}<small>المرحلة ${x.stage}</small></span><b>${money(x.price)}</b></div>`).join('')||'<div class="mu">لا توجد خطة حالياً</div>'}${tp.length?`<p class="mu">التكلفة التقديرية: <b>${money(tp.reduce((s,x)=>s+Number(x.price),0))}</b></p>`:''}</div>`;
 if(tab=='pr')b=`<div class="c"><h3>أسعار الإجراءات</h3>${sv.filter(s=>s.active).map(s=>`<div class="row"><span>${s.name}</span><b>${money(s.default_price)}</b></div>`).join('')||'<div class="mu">لم تحدد العيادة الأسعار بعد</div>'}</div>`;
 if(tab=='rx')b=rx.map(r=>`<div class="c"><h3>${dd(r.created_at)}</h3>${(r.prescription_items||[]).map(i=>`<div class="row"><span><b>${i.drug_name}</b><small>${[i.dose,i.times_per_day,i.duration].filter(Boolean).join(' - ')}</small></span></div>`).join('')}${r.instructions?`<p class="mu">${r.instructions}</p>`:''}</div>`).join('')||'<div class="c mu">لا توجد وصفات</div>';
 if(tab=='cn'){const w=(CL.whatsapp||'').replace(/\D/g,'');b=`<div class="c"><h3>${CL.name||'العيادة'}</h3><p>${CL.address||''}</p><div style="display:flex;gap:8px;flex-wrap:wrap">${CL.phone?`<a class="b" href="tel:${CL.phone}">📞 اتصال</a>`:''}${w?`<a class="b" href="https://wa.me/${w}">💬 واتساب</a>`:''}${CL.lat?`<a class="b" href="https://maps.google.com/?q=${CL.lat},${CL.lng}">📍 الموقع</a>`:CL.address?`<a class="b" href="https://maps.google.com/?q=${encodeURIComponent(CL.address)}">📍 الموقع</a>`:''}</div>${!CL.phone&&!w&&!CL.address?'<p class="mu">لم تُسجّل العيادة بيانات التواصل بعد.</p>':''}</div><button onclick="out()" style="width:100%">تسجيل الخروج</button>`}
 A.innerHTML=`<div class="c" style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px"><b>${CL.name||'العيادة'}</b><button onclick="view='dir';render()">🏥 العيادات</button></div><div class="nav">${nav}</div>${b}`}
async function cancelA(id){if(!confirm('إلغاء هذا الموعد؟'))return;const r=await db.rpc('cancel_my_appointment',{p_id:id});if(r.error)return toast('خطأ: '+r.error.message);toast('أُلغي الموعد');load()}
async function book(){
 const r=await db.rpc('request_appointment',{p_clinic:cid,p_service:$('bs').value||null,p_doctor:$('bd').value||null,p_time:new Date($('bt').value).toISOString()});
 if(r.error)return toast('خطأ: '+r.error.message);toast('أُرسل طلبك');tab='apt';load()}
boot();
</script>
</body>
</html>
